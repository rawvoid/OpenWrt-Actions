# Sysctl tuning for Redmi AX6 (IPQ8071A, 512 MiB RAM, Qualcomm NSS) primary router.
# Loaded after /etc/sysctl.d/10-default.conf and 12-tcp-bbr.conf.

# Auto-reboot 10s after kernel panic or oops for unattended 7x24 recovery
kernel.panic = 10
kernel.panic_on_oops = 1

# Conntrack sizing appropriate for 512 MiB RAM with NSS + ath11k offload
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
