# Sysctl tuning for Intel N3160 / I210 4GB RAM wired primary router.
# Loaded after /etc/sysctl.d/10-default.conf and 12-tcp-bbr.conf.

# Auto-reboot 10s after kernel panic or oops for unattended 7x24 recovery
kernel.panic = 10
kernel.panic_on_oops = 1

# Conntrack sizing for 4GB RAM (~40MB at 131072 entries; lower to 65536 if preferred)
net.netfilter.nf_conntrack_max = 131072
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30

# SoftIRQ / RX backlog tuning for PPPoE & Gigabit forwarding
net.core.netdev_max_backlog = 4096
net.core.netdev_budget = 600
# Balance between Linux 6.12 default (2000 us, lower jitter) and legacy 8000 us (peak throughput)
net.core.netdev_budget_usecs = 4000
