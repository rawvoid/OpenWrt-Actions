name: Repository Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Validate Scripts, Configs & Workflows
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          if ! command -v shellcheck >/dev/null 2>&1 || ! python3 -c "import yaml" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck python3-yaml
          fi

      - name: Run repository integrity suite
        run: ./scripts/test-repo.sh
