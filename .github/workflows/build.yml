name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: Target device profile under devices/
        type: choice
        required: true
        default: n3160-i210
        options:
          - n3160-i210
      ref_override:
        description: Override UPSTREAM_REF (tag or branch, e.g. v25.12.3); leave empty to use device.env
        type: string
        required: false
        default: ""
      use_cache:
        description: Restore and save dl/ and .ccache/ caches
        type: boolean
        required: false
        default: true
      publish_release:
        description: Publish firmware artifacts to GitHub Releases
        type: boolean
        required: false
        default: true
      ssh_debug:
        description: Start an interactive tmate SSH session before download/build (actor-restricted)
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ inputs.device }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run repository integrity checks
        run: |
          if ! command -v shellcheck >/dev/null 2>&1 || ! python3 -c "import yaml" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck python3-yaml
          fi
          ./scripts/test-repo.sh

      - name: Load device metadata
        env:
          INPUT_DEVICE: ${{ inputs.device }}
          INPUT_REF_OVERRIDE: ${{ inputs.ref_override }}
        run: |
          env_file="devices/${INPUT_DEVICE}/device.env"
          seed_file="devices/${INPUT_DEVICE}/seed.config"
          if [ ! -f "$env_file" ] || [ ! -f "$seed_file" ]; then
            echo "ERROR: Missing device.env or seed.config for ${INPUT_DEVICE}" >&2
            exit 1
          fi

          # shellcheck disable=SC1090
          source "$env_file"

          effective_ref="${INPUT_REF_OVERRIDE:-$UPSTREAM_REF}"
          safe_ref="${effective_ref//\//-}"
          seed_hash="$(sha256sum "$seed_file" | awk '{print substr($1, 1, 12)}')"
          build_date="$(date -u '+%Y%m%d')"
          release_tag="${DEVICE_NAME}-${safe_ref}-${build_date}-r${GITHUB_RUN_NUMBER}"

          {
            echo "DEVICE_NAME=${DEVICE_NAME}"
            echo "DEVICE_TITLE=${DEVICE_TITLE:-$DEVICE_NAME}"
            echo "UPSTREAM_FLAVOR=${UPSTREAM_FLAVOR}"
            echo "UPSTREAM_REPO=${UPSTREAM_REPO}"
            echo "UPSTREAM_REF=${UPSTREAM_REF}"
            echo "EFFECTIVE_REF=${effective_ref}"
            echo "SAFE_REF=${safe_ref}"
            echo "TARGET_DIR=${TARGET_DIR}"
            echo "ARTIFACT_GLOB=${ARTIFACT_GLOB}"
            echo "PKG_MANAGER=${PKG_MANAGER:-apk}"
            echo "SEED_HASH=${seed_hash}"
            echo "BUILD_DATE=${build_date}"
            echo "RELEASE_TAG=${release_tag}"
          } >> "$GITHUB_ENV"

      - name: Free disk space (>= 30 GiB)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          if [ -f /mnt/swapfile ]; then
            sudo swapoff /mnt/swapfile || true
            sudo rm -f /mnt/swapfile
          fi
          echo "=== Disk space after cleanup ==="
          df -h
          avail_gb="$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')"
          echo "Available space on workspace: ${avail_gb} GiB"
          if [ "${avail_gb:-0}" -lt 30 ]; then
            echo "ERROR: Expected at least 30 GiB free space, got ${avail_gb} GiB" >&2
            exit 1
          fi

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gettext gcc-multilib g++-multilib \
            genisoimage git gperf help2man intltool lib32gcc-s1 libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync squashfs-tools swig \
            texinfo unzip wget xmlto xxd zlib1g-dev zstd

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch "${EFFECTIVE_REF}" --single-branch "${UPSTREAM_REPO}" openwrt
          upstream_commit="$(git -C openwrt rev-parse --short HEAD)"
          echo "UPSTREAM_COMMIT=${upstream_commit}" >> "$GITHUB_ENV"
          echo "Cloned ${UPSTREAM_REPO} @ ${EFFECTIVE_REF} (${upstream_commit})"

      - name: Update and install feeds
        run: |
          append_file="devices/${DEVICE_NAME}/feeds.conf.append"
          if [ -f "$append_file" ]; then
            cat "$append_file" >> openwrt/feeds.conf.default
          fi
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Cache dl/ sources
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.UPSTREAM_FLAVOR }}-${{ env.SAFE_REF }}-${{ env.SEED_HASH }}
          restore-keys: |
            dl-${{ env.UPSTREAM_FLAVOR }}-${{ env.SAFE_REF }}-
            dl-${{ env.UPSTREAM_FLAVOR }}-

      - name: Cache ccache/ compiler objects
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.DEVICE_NAME }}-${{ env.UPSTREAM_FLAVOR }}-${{ env.SAFE_REF }}-${{ env.SEED_HASH }}
          restore-keys: |
            ccache-${{ env.DEVICE_NAME }}-${{ env.UPSTREAM_FLAVOR }}-${{ env.SAFE_REF }}-

      - name: Configure ccache size limit
        run: |
          mkdir -p openwrt/.ccache
          CCACHE_DIR="${GITHUB_WORKSPACE}/openwrt/.ccache" ccache -M 2G

      - name: Merge layered custom files
        run: |
          mkdir -p openwrt/files
          if [ -d common/files ]; then
            cp -a common/files/. openwrt/files/
          fi
          if [ -d "devices/${DEVICE_NAME}/files" ]; then
            cp -a "devices/${DEVICE_NAME}/files/." openwrt/files/
          fi
          if [ -d openwrt/files/etc/uci-defaults ]; then
            chmod +x openwrt/files/etc/uci-defaults/*
          fi
          if [ -f openwrt/files/etc/rc.local ]; then
            chmod +x openwrt/files/etc/rc.local
          fi

      - name: Apply seed.config and run defconfig
        run: |
          cp "devices/${DEVICE_NAME}/seed.config" openwrt/.config
          pre_hook="${GITHUB_WORKSPACE}/devices/${DEVICE_NAME}/pre-defconfig.sh"
          cd openwrt
          if [ -x "$pre_hook" ]; then
            "$pre_hook"
          fi
          make defconfig

      - name: Verify generated .config (Fail-Fast)
        run: |
          verify_script="devices/${DEVICE_NAME}/verify.sh"
          if [ -x "$verify_script" ]; then
            "$verify_script" openwrt/.config | tee "${RUNNER_TEMP}/verify.log"
          else
            echo "No verify.sh found for ${DEVICE_NAME}; skipping verification."
          fi

      - name: Setup tmate SSH debug session
        if: ${{ inputs.ssh_debug }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -type f \( -empty -o -name '*.dl' \) -delete

      - name: Compile firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s
          CCACHE_DIR="${GITHUB_WORKSPACE}/openwrt/.ccache" ccache -s || true

      - name: Collect artifacts and release notes
        run: |
          ./scripts/collect-artifacts.sh \
            "devices/${DEVICE_NAME}/device.env" \
            openwrt \
            output \
            "${RUNNER_TEMP}/verify.log"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}-r${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.DEVICE_NAME }} (${{ env.EFFECTIVE_REF }}) - ${{ env.BUILD_DATE }}"
          body_path: output/release-body.md
          files: |
            output/${{ env.ARTIFACT_GLOB }}
            output/sha256sums
            output/build.seed.config
